name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changes in repository
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: |
          sed -e "s|{{api_url}}|$API_URL|" .env > .env.production
          npm run build
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Deploy Front End
        working-directory: frontend
        run: |
          git clone https://$PAT@github.com/Stelele/njeremoto-dashboard-build.git out
          rm -r out/*
          cp -R dist/* out/
          cd out
          cp index.html 404.html
          git config --global user.email "giftmugweni@gmail.com"
          git config --global user.name "stelele"
          git add .
          git commit -m "Deploy build files"
          git push origin $DEPLOY_BRANCH
        env:
          DEPLOY_BRANCH: main
          PAT: ${{ secrets.PAT }}

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        working-directory: backend
        run: dotnet test --configuration Release --no-build
        env:
          R2__AccountId: "00000000000000000000000000000000"
          R2__AccessKeyId: "dummy"
          R2__SecretAccessKey: "dummy"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/erpnext-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/erpnext-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Replace docker-compose placeholders
        run: |
          sed -i \
            -e 's|{{MEDIATR_LICENSEKEY}}|${{ secrets.MEDIATR_LICENSE_KEY }}|g' \
            -e 's|{{R2_ACCOUNT_ID}}|${{ secrets.R2_ACCOUNT_ID }}|g' \
            -e 's|{{R2_ACCESS_KEY_ID}}|${{ secrets.R2_ACCESS_KEY_ID }}|g' \
            -e 's|{{R2_SECRET_ACCESS_KEY}}|${{ secrets.R2_SECRET_ACCESS_KEY }}|g' \
            -e 's|{{R2_BACKUP_BUCKET_NAME}}|${{ secrets.R2_BACKUP_BUCKET_NAME }}|g' \
            -e 's|{{R2_PUBLIC_BUCKET_NAME}}|${{ secrets.R2_PUBLIC_BUCKET_NAME }}|g' \
            -e 's|{{R2_CDN_BASE_URL}}|${{ secrets.R2_CDN_BASE_URL }}|g' \
            -e 's|{{R2_SYNC_INTERVAL}}|15|g' \
            -e 's|{{APP_FRONTEND_URL}}|${{ secrets.APP_FRONTEND_URL }}|g' \
            -e 's|{{SMTP_HOST}}|${{ secrets.SMTP_HOST }}|g' \
            -e 's|{{SMTP_PORT}}|587|g' \
            -e 's|{{SMTP_USERNAME}}|${{ secrets.SMTP_USERNAME }}|g' \
            -e 's|{{SMTP_PASSWORD}}|${{ secrets.SMTP_PASSWORD }}|g' \
            -e 's|{{SMTP_FROM}}|${{ secrets.SMTP_FROM }}|g' \
            backend/docker-compose.yml

      - name: Copy docker-compose.yml to droplet
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: backend/docker-compose.yml
          target: /opt/erpnext-dashboard

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            mv /opt/erpnext-dashboard/backend/docker-compose.yml /opt/erpnext-dashboard/docker-compose.yml
            cd /opt/erpnext-dashboard

            # Create volume if it doesn't exist
            if ! sudo docker volume inspect erpnext_data >/dev/null 2>&1; then
              echo "Creating docker volume erpnext_data"
              sudo docker volume create erpnext_data
            fi

            # Stop existing container if running
            sudo docker compose -f docker-compose.yml down

            # Pull latest image
            sudo docker compose -f docker-compose.yml pull

            # Start container
            sudo docker compose -f docker-compose.yml up -d

            # Wait for container to start
            sleep 10

            # Verify container is running
            sudo docker ps | grep erpnext-dashboard

            echo "Deployment complete"
