# OCR reviewer: the configuration lives in ONE place — Stelele/ocr-review
# (.github/workflows/ocr-review.yml). Tune the review inputs there, not here.
# The OCR_LLM_URL / OCR_LLM_TOKEN / OCR_LLM_MODEL secrets are taken from THIS
# repo and passed in via secrets: inherit.
name: ocr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: ai code review
    uses: Stelele/ocr-review/.github/workflows/ocr-review.yml@main
    secrets: inherit
